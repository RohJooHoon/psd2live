{padding:7px 9px;font-size:10px}.list-search{width:100%;margin-left:0;padding:9px}.list-search input{font-size:11px}.document-row{padding:14px 3px;gap:11px}.category-tag{display:none}.row-arrow{margin-left:0;font-size:14px}.help-strip{padding:18px;gap:12px;flex-wrap:wrap;margin:28px 0}.help-symbol{font-size:21px}.help-strip>div{flex:1}.help-strip .search-trigger{margin-left:32px;padding:7px 10px}footer{font-size:8px;flex-direction:column;gap:5px;padding:20px 0}.article-header h1{font-size:27px}.article-meta{font-size:9px;gap:8px}.article-meta button{font-size:9px}.prose h2{font-size:21px}.prose h3{font-size:17px}.prev-next{gap:10px}.prev-next a{padding:13px}.prev-next strong{font-size:11px}.search-dialog{top:6vh;max-height:87vh}.search-tools{font-size:9px}.search-box{padding:16px}.search-box input{font-size:12px}.reading .breadcrumb{margin-bottom:28px}}

@media print{.topbar,.sidebar,.toc,.mobile-toc,.prev-next,.search-dialog,.copy-code,.article-meta button,.skip-link,.scrim{display:none!important}.workspace{margin:0;display:block}.workspace>main{max-width:none;padding:0}.prose pre{white-space:pre-wrap;max-height:none}.table-scroll{overflow:visible}body{color:#000;background:#fff}a{color:inherit!important}.heading-anchor{display:none}footer{margin-top:30px}}

<body>
<a class="skip-link" href="#main" id="skip-link">본문으로 건너뛰기</a>
<header class="topbar">
  <button class="menu-toggle icon-button" type="button" aria-label="문서 메뉴 열기" aria-controls="sidebar" aria-expanded="false">☰</button>
  <a class="brand" href="#index"><span class="brand-mark"><!--LOGO--></span><strong>PSD2Live</strong><span class="brand-divider"></span><span class="brand-docs">Docs</span></a>
  <button class="search-trigger" type="button" aria-label="전체 문서 검색"><!--SEARCH_ICON--><span>문서 검색...</span><kbd>⌘ K</kbd></button>
  <div class="top-actions">
    <label class="language"><span aria-hidden="true">◎</span><select id="language-select" aria-label="문서 언어">
      <option value="" selected>한국어</option>
      <option value="<!--REPO-->/tree/master/docs/en">English</option>
      <option value="<!--REPO-->/tree/master/docs/ja">日本語</option>
      <option value="<!--REPO-->/tree/master/docs/zh">简体中文</option>
    </select></label>
    <button class="theme-toggle icon-button" type="button" aria-label="테마 전환" title="테마 전환">◐</button>
    <a class="github-link" href="<!--REPO-->" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</header>
<div class="scrim" hidden></div>
<aside class="sidebar" id="sidebar" aria-label="문서 탐색">
<!--NAV-->
</aside>
<div class="workspace" id="workspace">
  <main id="main" tabindex="-1">
<!--ARTICLES-->
    <footer><span>PSD2Live Documentation</span><span>docs/ko 원본 문서를 기반으로 · <a href="<!--REPO-->" target="_blank" rel="noopener">GitHub 저장소</a></span></footer>
  </main>
  <aside class="toc" id="toc" aria-label="이 페이지의 목차" hidden></aside>
</div>
<dialog class="search-dialog" aria-labelledby="search-title">
  <div class="search-box"><!--SEARCH_ICON--><label class="sr-only" id="search-title" for="search-input">전체 문서 검색</label><input id="search-input" placeholder="제목, 내용, 파일명으로 검색" autocomplete="off" spellcheck="false" type="search"><button class="close-search" type="button" aria-label="검색 닫기">Esc</button></div>
  <div class="search-tools"><span>한국어 문서 전체</span><span id="search-status" role="status">검색어를 입력하세요</span></div>
  <div id="search-results"></div>
  <div class="search-footer">↑ ↓ 이동 <span>Enter 열기 · Esc 닫기</span></div>
</dialog>
<div class="toast" role="status" hidden></div>
<script>
(function () {
  const META = /*META*/null;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const root = document.documentElement;
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

  /* theme */
  $('.theme-toggle').addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('psd2live-theme', root.dataset.theme); } catch (e) {}
  });

  /* language: other languages live on GitHub */
  $('#language-select').addEventListener('change', e => {
    const v = e.target.value;
    if (v) { window.open(v, '_blank', 'noopener'); e.target.value = ''; }
  });

  /* mobile menu */
  const menu = $('.menu-toggle'), scrim = $('.scrim');
  const toggleMenu = open => {
    document.body.classList.toggle('menu-open', open);
    menu.setAttribute('aria-expanded', String(open));
    menu.setAttribute('aria-label', open ? '문서 메뉴 닫기' : '문서 메뉴 열기');
    scrim.hidden = !open;
  };
  menu.addEventListener('click', () => toggleMenu(menu.getAttribute('aria-expanded') !== 'true'));
  scrim.addEventListener('click', () => toggleMenu(false));
  $('#skip-link').addEventListener('click', e => { e.preventDefault(); $('#main').focus(); });

  /* toast + copy */
  let toastTimer;
  const toast = msg => { const t = $('.toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); };
  async function copy(text, msg) {
    try { await navigator.clipboard.writeText(text); toast(msg); }
    catch (e) { toast('복사할 수 없습니다. 텍스트를 선택해 복사해 주세요.'); }
  }
  document.addEventListener('click', e => {
    const code = e.target.closest('.copy-code');
    if (code) return copy(code.parentElement.querySelector('pre').textContent, '코드를 복사했습니다.');
    if (e.target.closest('.copy-link')) copy(location.href, '문서 링크를 복사했습니다.');
  });

  /* routing */
  const workspace = $('#workspace'), toc = $('#toc');
  let current = null, spy = null;
  function parseHash() {
    let h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}
    if (!h) return { doc: 'index', target: null };
    const doc = h.split('::')[0];
    if (!META.titles[doc]) return { doc: 'index', target: null };
    return { doc, target: h.includes('::') ? h : null };
  }
  function show() {
    const { doc, target } = parseHash();
    if (doc !== current) {
      $$('#main > article').forEach(a => { a.hidden = a.id !== doc; });
      $$('#sidebar [data-doc]').forEach(a => {
        const on = a.dataset.doc === doc;
        a.classList.toggle('active', on);
        if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
      const link = $(`#sidebar [data-doc="${CSS.escape(doc)}"]`);
      const sb = $('#sidebar');
      if (link && (link.offsetTop < sb.scrollTop || link.offsetTop > sb.scrollTop + sb.clientHeight - 60)) sb.scrollTop = Math.max(0, link.offsetTop - 240);
      workspace.classList.toggle('reading', doc !== 'index');
      document.title = doc === 'index' ? 'PSD2Live 문서' : `${META.titles[doc]} · PSD2Live 문서`;
      current = doc;
      buildToc(doc);
      renderMermaid(document.getElementById(doc));
    }
    toggleMenu(false);
    const el = target && document.getElementById(target);
    if (el) {
      if (el.tagName === 'DETAILS') el.open = true;
      el.scrollIntoView();
    } else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);

  function buildToc(doc) {
    if (spy) spy.disconnect();
    const art = document.getElementById(doc);
    const hs = doc === 'index' ? [] : $$('.prose h2, .prose h3', art);
    if (hs.length < 2) { toc.hidden = true; toc.innerHTML = ''; return; }
    const h1 = $('.article-header h1', art);
    toc.innerHTML = '<h2>이 페이지에서</h2><nav>' + hs.map(h => `<a class="depth-${h.tagName[1]}" href="#${encodeURIComponent(h.id)}"></a>`).join('') + `</nav><a class="back-top" href="#${encodeURIComponent(h1 ? h1.id : doc)}">맨 위로 ↑</a>`;
    const links = $$('nav a', toc);
    links.forEach((a, i) => { a.textContent = hs[i].textContent.replace(/#$/, '').trim(); });
    toc.hidden = false;
    const byId = new Map(hs.map((h, i) => [h.id, links[i]]));
    let active = null;
    spy = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) {
        if (active) active.classList.remove('active');
        active = byId.get(e.target.id);
        if (active) {
          active.classList.add('active');
          if (active.offsetTop < toc.scrollTop || active.offsetTop > toc.scrollTop + toc.clientHeight - 40) toc.scrollTop = active.offsetTop - 80;
        }
      }
    }, { rootMargin: '-100px 0px -65% 0px' });
    hs.forEach(h => spy.observe(h));
  }

  let mermaidState = null;
  function renderMermaid(art) {
    const blocks = $$('pre.mermaid:not([data-processed])', art);
    if (!blocks.length) return;
    const run = () => window.mermaid && window.mermaid.run({ nodes: blocks }).catch(() => {});
    if (mermaidState === 'ready') return run();
    if (mermaidState === 'loading' || mermaidState === 'failed') return;
    mermaidState = 'loading';
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
    s.onload = () => {
      window.mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'neutral' });
      mermaidState = 'ready';
      renderMermaid(document.getElementById(current));
    };
    s.onerror = () => { mermaidState = 'failed'; };
    document.head.appendChild(s);
  }

  /* library filter */
  let filter = 'all';
  const applyFilter = () => {
    const query = ($('#filter-input').value || '').trim().toLocaleLowerCase();
    let count = 0;
    $$('.document-row').forEach(row => {
      row.hidden = !((filter === 'all' || row.dataset.category === filter) && row.dataset.search.toLocaleLowerCase().includes(query));
      if (!row.hidden) count++;
    });
    $('#visible-count').textContent = count;
    $('.library .empty-state').hidden = count !== 0;
  };
  $$('[data-filter]').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.filter;
    $$('[data-filter]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    applyFilter();
  }));
  $('#filter-input').addEventListener('input', applyFilter);

  /* search: section-level index built from the page itself */
  const dialog = $('.search-dialog'), input = $('#search-input'), results = $('#search-results'), status = $('#search-status');
  let index = null, selected = -1, searchTimer;
  function buildIndex() {
    index = [];
    $$('#main > article:not(#index)').forEach(art => {
      const doc = art.id, title = META.titles[doc], file = META.paths[doc];
      const h1 = $('.article-header h1', art);
      let sec = { doc, id: h1 ? h1.id : doc, head: '', text: '' };
      const push = () => { if (sec.text.trim() || sec.head) { sec.low = (title + '\n' + file + '\n' + sec.head + '\n' + sec.text).toLowerCase(); sec.headLow = (sec.head || title).toLowerCase(); index.push(sec); } };
      for (const el of $('.prose', art).children) {
        if (/^H[1-6]$/.test(el.tagName)) {
          push();
          sec = { doc, id: el.id, head: el.textContent.replace(/#$/, '').trim(), text: '' };
        } else sec.text += ' ' + el.textContent.replace(/\s+/g, ' ');
      }
      push();
    });
  }
  function openSearch() {
    toggleMenu(false);
    if (!dialog.open) dialog.showModal();
    input.focus();
    input.select();
    if (!index) buildIndex();
    runSearch();
  }
  $$('.search-trigger').forEach(b => b.addEventListener('click', openSearch));
  $('.close-search').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', e => {
    if (e.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
  });
  results.addEventListener('click', e => { if (e.target.closest('.search-result')) dialog.close(); });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); }
    if (e.key === 'Escape') toggleMenu(false);
  });
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function runSearch() {
    const query = input.value.trim().toLowerCase();
    selected = -1;
    if (!query) {
      results.innerHTML = '<p class="empty-state">어떤 도움이 필요하신가요?<br>예: 시뮬레이션, PSD, 런타임, MCP</p>';
      status.textContent = '제목과 본문을 함께 검색합니다';
      return;
    }
    const terms = query.split(/\s+/).filter(Boolean);
    const hits = [];
    for (const s of index) {
      if (!terms.every(t => s.low.includes(t))) continue;
      let score = 0;
      for (const t of terms) {
        if (s.headLow.includes(t)) score += 10;
        if (META.titles[s.doc].toLowerCase().includes(t)) score += 4;
        score += Math.min(5, s.low.split(t).length - 1) * 0.3;
      }
      if (!s.head) score += 2;
      hits.push([score, s]);
    }
    hits.sort((a, b) => b[0] - a[0]);
    status.textContent = `${hits.length}개 결과${hits.length > 50 ? ' · 상위 50개 표시' : ''}`;
    const re = new RegExp('(' + terms.map(escRe).join('|') + ')', 'gi');
    const hl = s => escHtml(s).replace(re, '<mark>$1</mark>');
    results.innerHTML = hits.length ? hits.slice(0, 50).map(([, s]) => {
      const body = s.text.trim(), low = body.toLowerCase();
      let at = -1;
      for (const t of terms) { const k = low.indexOf(t); if (k >= 0 && (at < 0 || k < at)) at = k; }
      const start = Math.max(0, at - 45);
      const snip = (start ? '…' : '') + body.slice(start, start + 180) + (body.length > start + 180 ? '…' : '');
      return `<a class="search-result" href="#${encodeURIComponent(s.id)}"><strong>${hl(s.head || META.titles[s.doc])}</strong><small>${escHtml(META.titles[s.doc])} · ${escHtml(META.paths[s.doc])}</small>${snip ? `<p>${hl(snip)}</p>` : ''}</a>`;
    }).join('') : '<p class="empty-state">일치하는 문서가 없습니다.<br>다른 검색어를 사용해 보세요.</p>';
  }
  input.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 100); });
  input.addEventListener('keydown', e => {
    const links = $$('.search-result', results);
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && links.length) {
      e.preventDefault();
      selected = (selected + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
      links.forEach((l, i) => l.classList.toggle('selected', i === selected));
      links[selected].scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'Enter' && links.length) { e.preventDefault(); links[Math.max(0, selected)].click(); }
  });

  show();
})();
</script>
</body>
</html>
